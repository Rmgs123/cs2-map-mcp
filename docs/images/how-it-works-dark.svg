<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How CS2 Map MCP works: the AI client calls the cs2map server over MCP, the server writes map files into a CS2 addon, Valve's resourcecompiler builds them, CS2 loads the map, and screenshots and test results go back to the AI">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/></marker></defs>
<rect width="800" height="330" rx="12" fill="#0d1117"/>
<rect x="24" y="40" width="186" height="74" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="117.0" y="73.0" text-anchor="middle" font-size="16" font-weight="600" fill="#f0f6fc">AI client</text>
<text x="117.0" y="93.0" text-anchor="middle" font-size="12.5" fill="#9198a1">Claude Code · Codex · any</text>
<rect x="318" y="40" width="174" height="74" rx="10" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/>
<text x="405.0" y="73.0" text-anchor="middle" font-size="16" font-weight="600" fill="#f0f6fc">cs2map server</text>
<text x="405.0" y="93.0" text-anchor="middle" font-size="12.5" fill="#9198a1">MCP · 49 tools</text>
<rect x="590" y="40" width="186" height="74" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="683.0" y="73.0" text-anchor="middle" font-size="16" font-weight="600" fill="#f0f6fc">Map files</text>
<text x="683.0" y="93.0" text-anchor="middle" font-size="12.5" fill="#9198a1">.vmap · .vmat · .vmdl · scripts</text>
<rect x="590" y="222" width="186" height="74" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="683.0" y="255.0" text-anchor="middle" font-size="16" font-weight="600" fill="#f0f6fc">resourcecompiler</text>
<text x="683.0" y="275.0" text-anchor="middle" font-size="12.5" fill="#9198a1">Valve's map compiler</text>
<rect x="318" y="222" width="174" height="74" rx="10" fill="#3b2e0a" stroke="#bb8009" stroke-width="1.5"/>
<text x="405.0" y="255.0" text-anchor="middle" font-size="16" font-weight="600" fill="#f0f6fc">Counter-Strike 2</text>
<text x="405.0" y="275.0" text-anchor="middle" font-size="12.5" fill="#9198a1">Workshop Tools</text>
<path d="M 214 66 L 312 66" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#head)"/>
<text x="264.0" y="58" text-anchor="middle" font-size="13" fill="#9198a1">tool calls</text>
<path d="M 314 92 L 216 92" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#head)"/>
<text x="264.0" y="112" text-anchor="middle" font-size="13" fill="#9198a1">results, frames</text>
<path d="M 496 77.0 L 584 77.0" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#head)"/>
<text x="541.0" y="68.0" text-anchor="middle" font-size="13" fill="#9198a1">writes</text>
<path d="M 683.0 118 L 683.0 216" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#head)"/>
<text x="695.0" y="173.0" text-anchor="start" font-size="13" fill="#9198a1">compile</text>
<path d="M 586 259.0 L 498 259.0" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#head)"/>
<text x="541.0" y="250.0" text-anchor="middle" font-size="13" fill="#9198a1">loads .vpk</text>
<path d="M 405.0 218 L 405.0 120" fill="none" stroke="#9198a1" stroke-width="1.8" marker-end="url(#head)"/>
<text x="393.0" y="156.0" text-anchor="end" font-size="13" fill="#9198a1">screenshots, console,</text>
<text x="393.0" y="174.0" text-anchor="end" font-size="13" fill="#9198a1">real-input and bot tests</text>
<text x="400.0" y="316" text-anchor="middle" font-size="13" fill="#9198a1">The AI builds, compiles, plays and looks at the map, fixes what is wrong and builds again.</text>
</svg>
